openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Təhvil renovation project coordination API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Renovation projects and dashboard
  - name: scope
    description: Rooms and agreed work scope
  - name: changes
    description: Change orders
  - name: milestones
    description: Handover and revision workflows
  - name: payments
    description: Manual payment tracking
  - name: activity
    description: Audit timeline, invitations, and passport
  - name: storage
    description: Private project evidence and document storage
  - name: smeta
    description: AI Smeta estimates, budget control and client approval
  - name: home
    description: Digital home passport — homes, rooms, work records, performers (individuals, teams, companies), utility map, equipment, QR sharing
  - name: realtor
    description: Realtor sales and trust platform — listings, leads, appointments, WhatsApp automation and Təhvil-certified apartment passports
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects available to the signed-in participant
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a renovation project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}/archive:
    post:
      operationId: archiveProject
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Archived project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
  /projects/{projectId}/scope/new-version:
    post:
      operationId: createScopeVersion
      tags: [scope]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: New editable version created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /projects/{projectId}/scope-items/{scopeItemId}:
    put:
      operationId: updateScopeItem
      tags: [scope]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: scopeItemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScopeItemInput" }
      responses:
        "200":
          description: Draft item updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScopeItem" }
  /projects/{projectId}/passport/shares:
    get:
      operationId: listPassportShares
      tags: [activity]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Owner's share records, without secret tokens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PassportShareRecord" }
    post:
      operationId: createPassportShare
      tags: [activity]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassportShareInput" }
      responses:
        "201":
          description: Expiring read-only share created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassportShare" }
  /projects/{projectId}/passport/shares/{shareId}:
    delete:
      operationId: revokePassportShare
      tags: [activity]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: shareId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Share revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /shared-passports/{token}:
    get:
      operationId: getSharedPassport
      tags: [activity]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 40, maxLength: 100 }
      responses:
        "200":
          description: Sanitized read-only summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  passport: { $ref: "#/components/schemas/Passport" }
                  includeFinancial: { type: boolean }
                  expiresAt: { type: string, format: date-time }
                required: [passport, includeFinancial, expiresAt]
  /projects/{projectId}/dashboard:
    get:
      operationId: getProjectDashboard
      tags: [projects]
      summary: Get the project overview and action items
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /projects/{projectId}/rooms:
    get:
      operationId: listRooms
      tags: [scope]
      summary: List project rooms
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
    post:
      operationId: createRoom
      tags: [scope]
      summary: Add a room or zone
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
  /projects/{projectId}/scope-items:
    get:
      operationId: listScopeItems
      tags: [scope]
      summary: List included and excluded scope items
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Scope items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScopeItem"
    post:
      operationId: createScopeItem
      tags: [scope]
      summary: Add an included or excluded scope item
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeItemInput"
      responses:
        "201":
          description: Scope item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeItem"
  /projects/{projectId}/scope/submit:
    post:
      operationId: submitScope
      tags: [scope]
      summary: Submit the current scope version for approval
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Scope submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /projects/{projectId}/scope/approve:
    post:
      operationId: approveScope
      tags: [scope]
      summary: Approve the pending scope version
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalInput"
      responses:
        "200":
          description: Scope approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /projects/{projectId}/change-orders:
    get:
      operationId: listChangeOrders
      tags: [changes]
      summary: List project change orders
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Change orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChangeOrder"
    post:
      operationId: createChangeOrder
      tags: [changes]
      summary: Create and submit a change order
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeOrderInput"
      responses:
        "201":
          description: Change order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeOrder"
  /change-orders/{changeOrderId}/decision:
    post:
      operationId: decideChangeOrder
      tags: [changes]
      summary: Approve, reject, or request clarification on a change order
      parameters:
        - name: changeOrderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeOrderDecision"
      responses:
        "200":
          description: Change order updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeOrder"
  /projects/{projectId}/milestones:
    get:
      operationId: listMilestones
      tags: [milestones]
      summary: List project milestones
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Milestones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Milestone"
    post:
      operationId: createMilestone
      tags: [milestones]
      summary: Create a project milestone
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneInput"
      responses:
        "201":
          description: Milestone created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"
  /milestones/{milestoneId}/handover:
    post:
      operationId: submitMilestoneHandover
      tags: [milestones]
      summary: Submit a milestone with evidence for handover
      parameters:
        - name: milestoneId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoverInput"
      responses:
        "200":
          description: Milestone submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"
  /milestones/{milestoneId}/decision:
    post:
      operationId: decideMilestone
      tags: [milestones]
      summary: Accept a handover or request a revision
      parameters:
        - name: milestoneId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneDecision"
      responses:
        "200":
          description: Milestone decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"
  /milestones/{milestoneId}/revisions:
    get:
      operationId: listRevisionRequests
      tags: [milestones]
      summary: List revision requests for a milestone
      parameters:
        - name: milestoneId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revision requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevisionRequest"
    post:
      operationId: createRevisionRequest
      tags: [milestones]
      summary: Create a structured revision request
      parameters:
        - name: milestoneId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionInput"
      responses:
        "201":
          description: Revision request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionRequest"
  /revisions/{revisionId}/reply:
    post:
      operationId: replyToRevision
      tags: [milestones]
      summary: Record a contractor response to a revision request
      parameters:
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionReply"
      responses:
        "200":
          description: Revision response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionRequest"
  /revisions/{revisionId}/resolve:
    post:
      operationId: resolveRevision
      tags: [milestones]
      summary: Resolve a revision request
      parameters:
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revision resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionRequest"
  /projects/{projectId}/payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List the manual project payment schedule
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Payment schedule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentItem"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Add a manual payment schedule item
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Payment item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentItem"
  /payments/{paymentId}/mark-sent:
    post:
      operationId: markPaymentSent
      tags: [payments]
      summary: Mark that the owner sent a payment
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentNote"
      responses:
        "200":
          description: Payment marked as sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentItem"
  /payments/{paymentId}/confirm:
    post:
      operationId: confirmPaymentReceived
      tags: [payments]
      summary: Confirm payment receipt
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentNote"
      responses:
        "200":
          description: Payment receipt confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentItem"
  /projects/{projectId}/timeline:
    get:
      operationId: listTimeline
      tags: [activity]
      summary: Get the append-only audit timeline
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineEvent"
  /projects/{projectId}/invitations:
    post:
      operationId: createInvitation
      tags: [activity]
      summary: Invite a contractor or viewer to a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Invitation created with a one-time share URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
  /invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [activity]
      summary: Accept a valid project invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAcceptInput"
      responses:
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}/passport:
    get:
      operationId: getRenovationPassport
      tags: [activity]
      summary: Get the printable renovation passport summary
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project archive summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passport"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a private presigned upload URL
      description: The file is uploaded directly to private object storage after this request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL and object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
  /projects/{projectId}/media/{mediaId}:
    get:
      operationId: getProjectMedia
      tags: [storage]
      summary: Serve project media after participant authorization
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Private file content
          content:
            "*/*":
              schema:
                type: string
                format: binary
  /smeta/projects:
    get:
      operationId: listSmetaProjects
      tags: [smeta]
      summary: List the signed-in contractor's AI Smeta projects
      responses:
        "200":
          description: Projects owned by the signed-in user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SmetaProject" }
    post:
      operationId: createSmetaProject
      tags: [smeta]
      summary: Create an estimate project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmetaProjectInput" }
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmetaProject" }
  /smeta/projects/{projectId}:
    get:
      operationId: getSmetaProject
      tags: [smeta]
      parameters:
        - $ref: "#/components/parameters/SmetaProjectId"
      responses:
        "200":
          description: Full project for its owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmetaProject" }
    put:
      operationId: updateSmetaProject
      tags: [smeta]
      summary: Save the contractor-editable part of a project
      description: Replaces estimate lines, measurements, change orders, expenses, photos and payments. Status, client decisions and sent versions are server-controlled and ignored.
      parameters:
        - $ref: "#/components/parameters/SmetaProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmetaProjectInput" }
      responses:
        "200":
          description: Saved project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmetaProject" }
    delete:
      operationId: deleteSmetaProject
      tags: [smeta]
      parameters:
        - $ref: "#/components/parameters/SmetaProjectId"
      responses:
        "200":
          description: Project deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /smeta/projects/{projectId}/share:
    post:
      operationId: shareSmetaEstimate
      tags: [smeta]
      summary: Freeze the current estimate as the client-visible version and (re)send the stable client link
      parameters:
        - $ref: "#/components/parameters/SmetaProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmetaShareInput" }
      responses:
        "200":
          description: Project with the active share
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmetaProject" }
    delete:
      operationId: revokeSmetaShare
      tags: [smeta]
      summary: Revoke the client link
      parameters:
        - $ref: "#/components/parameters/SmetaProjectId"
      responses:
        "200":
          description: Project without an active share
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmetaProject" }
  /shared-estimates/{token}:
    get:
      operationId: getSharedEstimate
      tags: [smeta]
      summary: Public client view of the last sent estimate version
      parameters:
        - $ref: "#/components/parameters/SharedEstimateToken"
      responses:
        "200":
          description: Sanitized estimate with all-in line prices; no margins, waste or internal costs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedEstimate" }
  /shared-estimates/{token}/approve:
    post:
      operationId: approveSharedEstimate
      tags: [smeta]
      parameters:
        - $ref: "#/components/parameters/SharedEstimateToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedEstimateApprovalInput" }
      responses:
        "200":
          description: Approval recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedEstimate" }
  /shared-estimates/{token}/revision:
    post:
      operationId: requestSharedEstimateRevision
      tags: [smeta]
      parameters:
        - $ref: "#/components/parameters/SharedEstimateToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedEstimateRevisionInput" }
      responses:
        "200":
          description: Revision request recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedEstimate" }
  /shared-estimates/{token}/change-orders/{changeOrderId}/decision:
    post:
      operationId: decideSharedChangeOrder
      tags: [smeta]
      parameters:
        - $ref: "#/components/parameters/SharedEstimateToken"
        - name: changeOrderId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedChangeOrderDecisionInput" }
      responses:
        "200":
          description: Client decision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedEstimate" }
  /realtor/overview:
    get:
      operationId: getRealtorOverview
      tags: [realtor]
      summary: Realtor dashboard summary (İcmal)
      responses:
        "200":
          description: Counters, today's leads, due follow-ups, upcoming appointments and notifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RealtorOverview" }
  /realtor/profile:
    get:
      operationId: getRealtorProfile
      tags: [realtor]
      responses:
        "200":
          description: The signed-in realtor's profile; `exists` is false before onboarding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RealtorProfile" }
    put:
      operationId: updateRealtorProfile
      tags: [realtor]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RealtorProfileInput" }
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RealtorProfile" }
  /realtor/media:
    post:
      operationId: attachRealtorMedia
      tags: [realtor]
      summary: Register freshly uploaded photos or logos for use in listings, passports and the profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RealtorMediaAttachInput" }
      responses:
        "200":
          description: Registered media
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RealtorMedia" }
  /realtor-media/{mediaId}:
    get:
      operationId: getRealtorMedia
      tags: [realtor]
      summary: Serve a realtor photo to its owner, or publicly when it appears in a published passport
      parameters:
        - $ref: "#/components/parameters/RealtorMediaId"
      responses:
        "200":
          description: Image content
          content:
            "*/*":
              schema: { type: string, format: binary }
  /realtor/agents:
    get:
      operationId: listRealtorAgents
      tags: [realtor]
